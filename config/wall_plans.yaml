defaults:
  block_size: [0.9, 0.6, 0.6]
wall_plans:
  basic_pick_and_place:
    block_bindings: {c0_b0: block_0}
    sequence:
    - id: c0_b0
      absolute_position: [-12.0, 1.0, 0.3]
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
  stack_block_1_on_block_2:
    block_bindings: {c0_b0: block_0, c0_b1: block_1}
    sequence:
    - id: c0_b0
      absolute_position: [-14.0, 2.0, 0.3]
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
    - id: c0_b1
      relative_to_world_model: c0_b0
      offset: [0.0, 0.0, 0.6]
      fallback_absolute_position: [-14.0, 2.0, 0.9]
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
  example_wall:
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c0_b2: block_2, c1_b0: block_3,
      c1_b1: block_4}
    # Where the crane looks from for a block it has not found yet: beside the pickup rows,
    # off the column-mounted lidar's line of sight, so the hanging gripper hides none.
    # y 3.5, behind the row the plans' +2 m put at y 2.0 (lab day 2026-11-04), and it clears
    # the lidar's line to block_2 just as well as the 3.9 it replaces (332). 3.9 was the
    # nearest that plans at all - 4.0 is refused, 0.085 m of hedge clearance against the
    # 0.100 m /a2b_movement requires - so its margin was about 0.1 m on a rigid model and a
    # hand-placed hedge box, which is not a margin at Seibersdorf (readiness R11).
    survey_position: [-14.5, 3.5]
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-15.0, -1.0, 0.3]
    # Pitch 0.89: aimed 1 cm into the neighbour; the side entry stops short or the neighbour stops
    # it, landing 0.90-0.92, the window the bridge above seats on.
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.11, -1.0, 0.3]
    - id: c0_b2
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-13.22, -1.0, 0.3]
    # course 1 seats on the measured block below: course 0's landing error stays out of the bond
    - id: c1_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.30, 0.0, 0.60]
      fallback_absolute_position: [-14.7, -1.0, 0.9]
    - id: c1_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b1
      offset: [0.30, 0.0, 0.60]
      fallback_absolute_position: [-13.81, -1.0, 0.9]
  # example_wall's first three: two on the ground, one bridging them
  wall_2_1:
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c1_b0: block_2}
    survey_position: [-13.5, 3.5]
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.0, -1.0, 0.3]
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.89, 0.0, 0.0]
      fallback_absolute_position: [-13.11, -1.0, 0.3]
    # bridge seats on where c0_b0 landed; fallback only shapes the plan, no pose -> waits
    - id: c1_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.30, 0.0, 0.60]
      fallback_absolute_position: [-13.7, -1.0, 0.9]
  wall_2_1_store:  # at the morning block store by the hedge
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c1_b0: block_2}
    survey_position: [-12.5, 0.5]
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-13.0, 3.9, 0.3]
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.89, 0.0, 0.0]
      fallback_absolute_position: [-12.11, 3.9, 0.3]
    # bridge seats on where c0_b0 landed; fallback only shapes the plan, no pose -> waits
    - id: c1_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.30, 0.0, 0.60]
      fallback_absolute_position: [-12.7, 3.9, 0.9]
  wall_2_1_rot90:  # wall_2_1 turned 90 deg, courses along +y at x -11
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c1_b0: block_2}
    survey_position: [-10.5, 5.5]
    sequence:
    - id: c0_b0
      yaw_deg: 90.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-11.0, 1.0, 0.3]
    - id: c0_b1
      yaw_deg: 90.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.0, 0.89, 0.0]
      fallback_absolute_position: [-11.0, 1.89, 0.3]
    - id: c1_b0
      yaw_deg: 90.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [0.0, 0.30, 0.60]
      fallback_absolute_position: [-11.0, 1.3, 0.9]
  wall_2_1_d45:  # course 48 deg to the radial line from K0, r 5.5/6.1 m
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c1_b0: block_2}
    survey_position: [-9.5, 0.0]
    sequence:
    - id: c0_b0
      yaw_deg: 135.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-12.40, -0.30, 0.3]
    - id: c0_b1
      yaw_deg: 135.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [-0.629, 0.629, 0.0]
      fallback_absolute_position: [-13.029, 0.329, 0.3]
    # bridge seats on where c0_b0 landed; fallback only shapes the plan, no pose -> waits
    - id: c1_b0
      yaw_deg: 135.0
      gripper_yaw_offset_deg: 90.0
      relative_to_world_model: c0_b0
      offset: [-0.212, 0.212, 0.60]
      fallback_absolute_position: [-12.612, -0.088, 0.9]
  calib_scene:  # store -> sensor calibration scene (wiki lidar_slew_calibration): r 3.5/6/8.2 m from the slew axis, bearings +28/+8/-10 deg around q1 -4 deg, broadside; back with wall_2_1_store
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c0_b2: block_2}
    survey_position: [-11.5, 2.5]
    sequence:
    - id: c0_b0
      yaw_deg: 114.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-10.14, -1.07, 0.3]
    - id: c0_b1
      yaw_deg: 94.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-12.92, -0.07, 0.3]
    - id: c0_b2
      yaw_deg: 76.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.89, 2.33, 0.3]  # 8.2 m: the farthest any plan has placed
  row3:
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c0_b2: block_2}
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-15.0, -1.0, 0.3]
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.1, -1.0, 0.3]  # in contact, pitch = block length 0.9
    - id: c0_b2
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-13.2, -1.0, 0.3]
  row3_middle_last:
    block_bindings: {c0_b0: block_0, c0_b1: block_1, c0_b2: block_2}
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-15.0, -1.0, 0.3]
    - id: c0_b2
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-13.16, -1.0, 0.3]
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.08, -1.0, 0.3]
  # The two blocks of world_model_seed_truck_loading.yaml off the truck bed; run with lift_height:=2.6.
  truck_wall:
    block_bindings: {c0_b0: block_1, c0_b1: block_2}
    survey_position: [-14.5, 3.5]
    sequence:
    - id: c0_b0
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-15.0, -1.0, 0.3]
    - id: c0_b1
      yaw_deg: 0.0
      gripper_yaw_offset_deg: 90.0
      absolute_position: [-14.11, -1.0, 0.3]
