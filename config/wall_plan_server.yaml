/**:
  ros__parameters:
    # World model integration
    world_model_service: "/world_model_node/get_coarse_blocks"
    world_model_timeout_s: 2.0
    world_model_set_goal_service: "/world_model_node/set_block_goal"
    world_model_clear_goals_service: "/world_model_node/clear_block_goals"
    # Pre-place angled approach: the BT's place waypoint is 0.30 m up and 0.30 tan(18 deg)
    # = 0.10 m to the open side; 4 deg (2 cm) left no clearance to a neighbour 2 cm away.
    place_approach_height_m: 0.30
    place_approach_angle_deg: 18.0
    # High A2B endpoint Z values in output_frame. With output_frame=world these
    # map through world->K0 to pickup K0 z=3.0 m and place K0 z=2.7 m. Place was 2.6: the
    # carried block then cleared a second-course neighbour by 0.149 m against the planner's 0.150,
    # once terrain had raised the course.
    pickup_a2b_approach_z_m: 4.141
    place_a2b_approach_z_m: 3.841
